# TrickBot — Banking trojan / loader (2016-present)
#
# TrickBot evolved from a banking trojan into a modular malware platform
# used as a loader for other threats (Ryuk, Conti, Diavol ransomware).
# Widely distributed via Emotet and phishing campaigns.
#
# References:
#   https://attack.mitre.org/software/S0266/
#   https://www.cisa.gov/news-events/cybersecurity-advisories/aa21-076a

malware: trickbot
aliases:
  - trick bot
  - trickbot banking trojan
  - trick loader
category: trojan

