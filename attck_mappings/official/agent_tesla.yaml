# AgentTesla — Infostealer / keylogger (2014-present)
#
# AgentTesla is a commercial infostealer sold on underground forums. Widely
# distributed via phishing emails with malicious attachments. Steals
# credentials, keystrokes, screenshots, and clipboard contents.
#
# References:
#   https://attack.mitre.org/software/S0331/
#   https://www.accenture.com/us-en/blogs/cyber-defense/agent-tesla-malware

