# RedLine Stealer — Infostealer (2020-present)
#
# RedLine is one of the most prevalent infostealers, sold as malware-as-a-
# service. Harvests browser credentials, crypto wallets, VPN credentials,
# and gaming accounts. Frequently distributed via YouTube ads and phishing.
#
# References:
#   https://attack.mitre.org/software/S1244/
#   https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-320a

malware: redline
aliases:
  - redline stealer
  - red line stealer
  - redlinestealer
category: infostealer

